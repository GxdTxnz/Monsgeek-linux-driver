// web.monsgeek.com v500.1.113
// iot_v215.exe, gRPC-web http://127.0.0.1:3814
syntax = "proto3";

package driver;

service DriverGrpc
{
  // поток со списком устройств
  rpc watchDevList(Empty) returns (stream DeviceList);
  // поток сообщений от клавиатуры
  rpc watchVender(Empty) returns (stream VenderMsg);
  rpc watchSystemInfo(Empty) returns (stream SystemInfo);

  // отправка команды
  rpc sendMsg(SendMsg) returns (ResSend);
  // чтение ответа команда
  // msg приходит без байта номера отчета
  // msg[0] - номер команды
  rpc readMsg(ReadMsg) returns (ResRead);
  rpc sendRawFeature(SendMsg) returns (ResSend);
  rpc readRawFeature(ReadMsg) returns (ResRead);

  rpc setLightType(SetLight) returns (Empty);
  rpc upgradeOTAGATT(OTAUpgrade) returns (stream Progress);
  rpc muteMicrophone(MuteMicrophone) returns (ResSend);
  rpc toggleMicrophoneMute(Empty) returns (ResSend);
  rpc getMicrophoneMute(Empty) returns (MicrophoneMuteStatus);
  rpc changeWirelessLoopStatus(WirelessLoopStatus) returns (Empty);

  // хранилище настроек в формате kv (на стороне сервера)
  rpc insertDb(InsertDb) returns (ResSend);
  rpc deleteItemFromDb(DeleteItem) returns (ResSend);
  rpc getItemFromDb(GetItem) returns (Item);
  rpc getAllKeysFromDb(GetAll) returns (AllList);
  rpc getAllValuesFromDb(GetAll) returns (AllList);

  rpc cleanDev(ReadMsg) returns (ResSend);
  rpc getVersion(Empty) returns (Version);
  rpc getWeather(WeatherReq) returns (WeatherRes);
}

enum DangleDevType
{
  DANGLEDEVTYPENONE = 0;
  KEYBOARD = 1;
  MOUSE = 2;
}

enum CheckSumType
{
  BIT7 = 0;
  BIT8 = 1;
  NONE = 2;
}

enum DeviceListChangeType
{
  INIT = 0;
  ADD = 1;
  REMOVE = 2;
  CHANGE = 3;
}

enum DeviceType
{
  YZWKEYBOARD = 0;
  YZWBOOT = 1;
  YZWVENDER = 2;
}

enum LightType
{
  MUSIC2 = 0;
  SCREEN = 1;
  OTHER = 2;
}

message Empty
{
}

message Version
{
  string baseVersion = 1;
  string timeStamp = 2;
}

message SendMsg
{
  string devicePath = 1;
  bytes msg = 2;
  CheckSumType checkSumType = 3;
  DangleDevType dangleDevType = 4;
}

message ReadMsg
{
  string devicePath = 1;
}

message ResSend
{
  // пусто = норм
  string err = 1;
}

message ResRead
{
  string err = 1;
  bytes msg = 2;
}

message Device
{
  DeviceType devType = 1;
  bool is24 = 2;
  string path = 3;
  // номер модели клавиатуры из ответа на запрос 0x8F чтобы вебка ее распознала 
  int32 id = 4;
  uint32 battery = 5;
  bool isOnline = 6;
  uint32 vid = 7;
  uint32 pid = 8;
}

message Status24
{
  uint32 battery = 1;
  bool isOnline = 2;
}

message DangleStatus
{
  oneof dangleDev
  {
    Empty empty = 1;
    Status24 status = 2;
  }
}

message DangleCommon
{
  DangleStatus keyboard = 1;
  DangleStatus mouse = 2;
  string path = 3;
  uint32 keyboardId = 5;
  uint32 mouseId = 6;
  uint32 vid = 7;
  uint32 pid = 8;
}

message DJDev
{
  oneof oneofDev
  {
    Device dev = 1;
    DangleCommon dangleCommonDev = 2;
  }
}

message DeviceList
{
  repeated DJDev devList = 1;
  DeviceListChangeType type = 2;
}

message VenderMsg
{
  bytes msg = 1;
}

message SetLight
{
  string devicePath = 1;
  LightType lightType = 2;
  uint32 screenId = 3;
  DangleDevType dangleDevType = 4;
}

message OTAUpgrade
{
  string devPath = 1;
  bytes fileBuf = 2;
}

message Progress
{
  float progress = 1;
  string err = 2;
}

message MuteMicrophone
{
  bool needMute = 1;
}

message MicrophoneMuteStatus
{
  bool isMute = 1;
  string err = 2;
}

message WirelessLoopStatus
{
  bool lock = 1;
}

message InsertDb
{
  string dbPath = 1;
  bytes key = 2;
  bytes value = 3;
}

message DeleteItem
{
  string dbPath = 1;
  bytes key = 2;
}

message GetItem
{
  string dbPath = 1;
  bytes key = 2;
}

message Item
{
  bytes value = 1;
  string errStr = 2;
}

message GetAll
{
  string dbPath = 1;
}

message AllList
{
  repeated bytes data = 1;
  string errStr = 2;
}

message SystemInfo
{
  uint64 diskSpaceTotal = 1;
  uint64 diskSpceAvailable = 2;
  uint64 netWorkTotalUp = 3;
  uint64 netWorkTotalDown = 4;
  float cpuTemperater = 5;
  uint64 memTotal = 6;
  uint64 memUsed = 7;
  float cpuUsage = 8;
}

message WeatherReq
{
  string language = 1;
  string address = 2;
}

message WeatherRes
{
  string res = 1;
}
