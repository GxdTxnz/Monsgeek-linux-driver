name: monsgeek-bridge
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: utils
priority: optional
maintainer: GxdTxnz <GxdTxnz@users.noreply.github.com>
license: GPL-3.0-or-later
homepage: https://github.com/GxdTxnz/Monsgeek-linux-driver
description: |
  Driver for Monsgeek keyboards support on Linux in a web application web.monsgeek.com

contents:
  - src: dist/monsgeek-bridge
    dst: /usr/bin/monsgeek-bridge
    file_info:
      mode: 0755
  - src: dist/70-monsgeek.rules
    dst: /usr/lib/udev/rules.d/70-monsgeek.rules
    file_info:
      mode: 0644
  - src: dist/monsgeek-bridge.service
    dst: /usr/lib/systemd/user/monsgeek-bridge.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/monsgeek-bridge/README.md
    file_info:
      mode: 0644
  - src: dist/LICENSE
    dst: /usr/share/doc/monsgeek-bridge/copyright
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/postinst.sh
  preremove: packaging/prerm.sh
  postremove: packaging/postrm.sh

overrides:
  deb:
    depends:
      - libc6 (>= 2.38)
      - libudev1

deb:
  compression: xz
